meters:
  - name: requests
    description: HTTP GET requests to /q/d/l/ counted against undisclosed daily quota.
    unit: request
    aggregation: count
    dimensions:
      - api_key
      - symbol
principles:
  - name: Visibility
    description: >-
      Log all outbound Stooq requests with symbol, timestamp, and response status. Track daily
      request count against the undisclosed quota to detect quota exhaustion before it occurs.
  - name: Allocation
    description: >-
      Assign API keys to specific workloads or teams. Each key has its own daily quota so
      separate keys per consuming service prevent cross-contamination of quota.
  - name: Optimization
    description: >-
      Cache all downloaded CSV data locally with a content-addressed store keyed by symbol,
      interval, and date range. Only fetch uncached date ranges to minimize daily request count.
      Schedule bulk database ZIP downloads from stooq.com/db/h/ to replace many individual
      calls for large backtests.
  - name: Accountability
    description: >-
      No monetary cost to track. Accountability centres on quota stewardship: assign a quota
      owner per API key, review daily hit counts in logs, and document CAPTCHA key renewal
      procedures so that rotation does not cause production outages.
