description: >-
  FinOps view of Stooq. The service is entirely free with no published paid tiers, so direct
  monetary cost is zero. The primary operational cost is engineering time spent managing the
  undisclosed daily request quota, implementing CAPTCHA-based API key renewal, and caching
  downloaded CSV data to stay within limits. Bulk database snapshots require manual download
  behind a CAPTCHA, adding operational overhead. No SLA or uptime commitment is published.
