description: >-
  Stooq is a Poland-based financial data platform offering free access to historical and current
  market data for global equities, indices, currencies, cryptocurrencies, commodities, bonds, and
  economic indicators. Data is delivered as CSV via a simple REST-style URL interface at
  https://stooq.com/q/d/l/ using query parameters for ticker symbol, date range, and interval.
  As of early 2026 an API key (obtained via CAPTCHA on the site) is required. A known daily
  request quota applies; exceeding it returns an "Exceeded the daily hits limit" message.
  Bulk point-in-time snapshots of the full database (12,000+ securities) are also available
  as ZIP-compressed CSVs from https://stooq.com/db/h/.
apis:
  - aid: stooq:historical-data-api
    name: Stooq Historical Data API
    tags:
      - Stocks
      - Indices
      - Currencies
      - Crypto
      - Commodities
      - OHLCV
      - Historical Data
      - CSV
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://stooq.com/q/d/l/
    humanURL: https://stooq.com/db/h/
    description: >-
      CSV-based REST endpoint returning OHLCV (Open, High, Low, Close, Volume) time series for a
      given ticker. Accepts query parameters: s (ticker symbol with optional exchange suffix such as
      .US, .UK, .DE, .JP, .HK, .HU), d1 (start date YYYYMMDD), d2 (end date YYYYMMDD), i (interval:
      d=daily, w=weekly, m=monthly, q=quarterly, y=yearly), and apikey. Covers 21,000+ global
      securities and ETFs, 1,980+ currency pairs, 130+ cryptocurrencies, global indices, commodities,
      and economic indicators. Daily history extends 30+ years for major instruments; hourly data
      spans ~9 months; 5-minute data ~1 month.
    properties:
      - type: Documentation
        url: https://stooq.com/db/h/
      - type: OpenAPI
        url: openapi/stooq-historical-data-api-openapi.yml
      - type: JSONSchema
